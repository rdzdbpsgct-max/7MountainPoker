<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle radial glow -->
  <circle cx="600" cy="315" r="400" fill="#10b981" opacity="0.03"/>
  <!-- Spade symbol -->
  <text x="600" y="220" text-anchor="middle" font-size="120" fill="#10b981" font-family="system-ui, sans-serif">♠</text>
  <!-- App name -->
  <text x="600" y="320" text-anchor="middle" font-size="72" font-weight="700" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif">7Mountain Poker</text>
  <!-- Tagline -->
  <text x="600" y="390" text-anchor="middle" font-size="32" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif">Tournament Timer for Home Games</text>
  <!-- Feature pills -->
  <rect x="200" y="440" width="160" height="40" rx="20" fill="#10b981" opacity="0.15"/>
  <text x="280" y="466" text-anchor="middle" font-size="16" fill="#10b981" font-family="system-ui, sans-serif">Blind Timer</text>
  <rect x="380" y="440" width="140" height="40" rx="20" fill="#10b981" opacity="0.15"/>
  <text x="450" y="466" text-anchor="middle" font-size="16" fill="#10b981" font-family="system-ui, sans-serif">Liga-Modus</text>
  <rect x="540" y="440" width="180" height="40" rx="20" fill="#10b981" opacity="0.15"/>
  <text x="630" y="466" text-anchor="middle" font-size="16" fill="#10b981" font-family="system-ui, sans-serif">Fernsteuerung</text>
  <rect x="740" y="440" width="140" height="40" rx="20" fill="#10b981" opacity="0.15"/>
  <text x="810" y="466" text-anchor="middle" font-size="16" fill="#10b981" font-family="system-ui, sans-serif">TV-Modus</text>
  <!-- Accent line -->
  <rect x="300" y="510" width="600" height="3" rx="1.5" fill="url(#accent)" opacity="0.4"/>
  <!-- Bottom text -->
  <text x="600" y="560" text-anchor="middle" font-size="20" fill="#6b7280" font-family="system-ui, sans-serif">Kostenlos · Offline · PWA · Deutsch &amp; English</text>
</svg>
