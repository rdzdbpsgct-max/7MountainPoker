name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      run_cross_e2e:
        description: 'Run cross-browser E2E (Chromium + WebKit)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests (Vitest)
        run: |
          npm run test 2>&1 | tee test-output.txt
          TEST_COUNT=$(grep 'Tests' test-output.txt | grep -oP '\d+(?= passed)' | head -1)
          echo "Test count: $TEST_COUNT"
          if [ -z "$TEST_COUNT" ] || [ "$TEST_COUNT" -lt 1300 ]; then
            echo "::error::Test count $TEST_COUNT is below minimum threshold of 1300"
            exit 1
          fi

      - name: Build (quality gate)
        run: npm run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (E2E server)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npm run test:e2e

  e2e-cross-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (E2E server)
        run: npm run build

      - name: Install Playwright browsers (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Cross-browser smoke E2E (PR gate)
        run: >
          npm run test:e2e:cross --
          tests/e2e/setup-to-game.spec.ts
          tests/e2e/league-multitable.spec.ts
          --project=chromium
          --project=webkit
          --workers=1
          --retries=0

  e2e-cross:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_cross_e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (E2E server)
        run: npm run build

      - name: Install Playwright browsers (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Cross-browser E2E Tests
        run: npm run test:e2e:cross

  pages-build:
    # Required secrets:
    #   VITE_SENTRY_DSN — Sentry DSN for error reporting (optional, monitoring disabled if not set)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (deploy)
        run: npm run build
        env:
          VITE_BASE_PATH: /7MountainPoker/
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}

      - name: Bundle size check
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh dist/assets/*.js | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          MAIN_BUNDLE=$(ls -S dist/assets/index-*.js 2>/dev/null | head -1)
          if [ -n "$MAIN_BUNDLE" ]; then
            MAIN_SIZE=$(wc -c < "$MAIN_BUNDLE" | tr -d ' ')
            MAX_SIZE=670000
            if [ "$MAIN_SIZE" -gt "$MAX_SIZE" ]; then
              echo "::error::Main bundle exceeds budget: ${MAIN_SIZE} bytes > ${MAX_SIZE} bytes"
              exit 1
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: './dist'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pages-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
